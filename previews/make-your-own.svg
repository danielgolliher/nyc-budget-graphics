<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <rect width="200" height="140" fill="#FAF9F6" rx="4"/>
  <!-- 1: your computer -->
  <g transform="translate(14,48)" fill="none" stroke="#BE5343" stroke-width="2">
    <rect x="4" y="2" width="36" height="24" rx="2"/>
    <path d="M0 30 H44" stroke-linecap="round"/>
    <circle cx="22" cy="11" r="4" fill="#BE5343" stroke="none"/>
    <path d="M14 23 C14 17 30 17 30 23" fill="#BE5343" stroke="none"/>
  </g>
  <!-- arrow -->
  <path d="M62 64 H74 M70 60 L75 64 L70 68" fill="none" stroke="#8B92A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 2: GitHub cloud -->
  <g transform="translate(78,44)">
    <path d="M9 32 C2 32 0 25 3 21 C2 14 9 10 14 13 C17 6 29 5 31 13 C38 11 43 17 41 23 C45 26 43 32 37 32 Z" fill="none" stroke="#2C3E6B" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3 2"/>
    <rect x="15" y="18" width="6" height="8" rx="1" fill="#2C3E6B"/>
    <rect x="23" y="18" width="6" height="8" rx="1" fill="#2C3E6B" opacity="0.5"/>
  </g>
  <!-- arrow -->
  <path d="M126 64 H138 M134 60 L139 64 L134 68" fill="none" stroke="#8B92A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 3: someone else's computer -->
  <g transform="translate(142,48)" fill="none" stroke="#2A8A7E" stroke-width="2">
    <rect x="4" y="2" width="36" height="24" rx="2"/>
    <path d="M0 30 H44" stroke-linecap="round"/>
    <rect x="9" y="7" width="14" height="3" rx="1.5" fill="#2A8A7E" stroke="none"/>
    <rect x="9" y="13" width="24" height="2.5" rx="1" fill="#2A8A7E" stroke="none" opacity="0.5"/>
    <rect x="9" y="18" width="20" height="2.5" rx="1" fill="#2A8A7E" stroke="none" opacity="0.5"/>
  </g>
  <!-- labels -->
  <g font-family="sans-serif" font-size="8" text-anchor="middle" fill="#5A6578">
    <text x="36" y="96">You</text>
    <text x="100" y="96">GitHub</text>
    <text x="164" y="96">Visitors</text>
  </g>
</svg>
