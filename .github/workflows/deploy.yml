name: Deploy site

# Builds main and publishes it to the gh-pages branch, which GitHub Pages serves at
# data.maximumnewyork.com. Runs on every push to main, so `npm run deploy` is only
# needed for a manual deploy from your own machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with refresh-bills.yml so two runs never push to gh-pages at the same time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: data.maximumnewyork.com
